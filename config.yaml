# AI 비서실 설정 — 이 파일만 고치면 비서들의 감시 대상·기준이 바뀝니다.

claude:
  model: claude-haiku-5-5    # 품질을 높이려면 claude-opus-5-5 (약 40배 비쌈)
  effort: low                # low | medium | high — 높을수록 꼼꼼하지만 비쌈

keep_days: 3                 # 지난 보고를 며칠간 화면에 남길지(후속 보도가 계속 나오면 그만큼 더 남음)
max_keep: 30                 # 비서별로 화면에 남길 최대 보고 수. 넘치면 덜 중요한 것(우선순위·보도량 낮은 것)부터 정리

# 비서별 확인 주기(분). 실행은 15분마다 돌고, 주기가 된 비서만 일합니다.
# 새 글이 없으면 Claude를 부르지 않으므로 비용이 들지 않습니다.
# 여론·민원 비서는 주기 대신 정해진 시각에 정리합니다(아래 opinion.times).
intervals:
  sns: 15
  press: 15
  telegram: 30
  assembly: 360

# ─────────────────────────────── 1. SNS 모니터링 비서
sns:
  hours: 30                  # 최근 몇 시간 내 보도만 볼지
  news_words: [페이스북, SNS, 인스타그램]
  exclude_words: [축제, 기념식, 개막식, 체육대회, 봉사활동, 생일, 축하]
  # tier 1 = 최우선, 2 = 주요, 3 = 참고
  # 등급별 검색 주기(분). 인원이 많아 전원을 15분마다 검색하면 네이버 하루 한도(2만5천 건)에 가까워지므로 나눔.
  tier_minutes: {1: 15, 2: 60, 3: 180}
  # name: 이름이 있으면 이름으로 검색. 비워 두면 key(없으면 role)로 검색 → 개각·선거로 사람이 바뀌어도 자동으로 따라감
  # key: 기사에 실제로 쓰이는 줄임 직책(예: 국토부 장관). 기사 제목·요약에 이 말이 있어야 수집됨
  # blog_id: 네이버 블로그 주소의 아이디(blog.naver.com/<아이디>) — 있으면 본인 블로그 글도 확인
  # ※ 이름은 2026.6.3 지방선거 결과·보도로 확인된 것만 넣었습니다. 장관은 교체가 잦아 직책으로 검색합니다.
