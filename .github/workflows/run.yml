name: AI 비서실 보고

on:
  schedule:
    # 15분마다 실행 (GitHub 사정으로 몇 분~수십 분 밀릴 수 있음)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 비서만 실행 (예: sns press). 비우면 주기가 된 비서만"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: secretary
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 비서 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ONLY: ${{ github.event.inputs.only }}
        run: python -m secretary.main $ONLY
      # 저장소에 커밋하지 않고 웹페이지로 바로 배포 (암호화 파일이 쌓여 용량이 차는 것을 방지)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
